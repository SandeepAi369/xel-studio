name: CI — Typecheck

# Type-checks the app on GitHub's runners (nothing runs on your machine).
# Skips the bot's news-history commits.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/news_history.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (from lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
