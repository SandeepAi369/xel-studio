name: "🗞️ News Pipeline"

on:
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
  repository_dispatch:
    types: [trigger-news-update]

permissions:
  contents: write

jobs:
  generate-news:
    name: Generate AI News
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for history push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Start SearchWala (optional)
        run: |
          echo "⬇️ Downloading SearchWala binary..."
          wget --timeout=30 --tries=2 -q \
            https://github.com/SandeepAi369/SearchWala/releases/latest/download/searchwala-linux-amd64 \
            -O searchwala || { echo "⚠️ SearchWala download failed, Tavily fallback will be used."; exit 0; }
          chmod +x searchwala
          ./searchwala &
          # Wait up to 15s for port 8000 to be ready
          for i in $(seq 1 15); do
            sleep 1
            if curl -sf http://localhost:8000/health > /dev/null 2>&1 || \
               curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "✅ SearchWala is up on port 8000 (${i}s)"
              exit 0
            fi
            echo "  ⏳ Waiting for SearchWala... ${i}/15s"
          done
          echo "⚠️ SearchWala did not respond in 15s, Tavily fallback will be used."
        continue-on-error: true

      - name: Run news pipeline
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # Primary image tier — Cloudflare Workers AI (flux-1-schnell)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/run_news_cycle.py
