name: Auto-Update g4f
on:
  schedule:
    # Check for g4f updates every Monday and Thursday at 06:00 UTC
    - cron: "0 6 * * 1,4"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-g4f:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for g4f updates
        id: check
        run: |
          set -e

          # ── 1. Get currently pinned version from requirements.txt ──
          CURRENT=$(grep -oP 'g4f\[image\]>=\K[\d.]+' scripts/requirements.txt || echo "0.0.0")
          echo "📦 Current pinned version: v$CURRENT"

          # ── 2. Get latest version from PyPI (3 methods, most reliable first) ──
          LATEST=""

          # Method A: pip index versions (modern pip)
          if [ -z "$LATEST" ]; then
            LATEST=$(pip index versions g4f 2>/dev/null | head -1 | grep -oP '\([\d.]+\)' | tr -d '()') || true
            [ -n "$LATEST" ] && echo "✅ Method A (pip index): v$LATEST"
          fi

          # Method B: PyPI JSON API (most reliable, no pip needed)
          if [ -z "$LATEST" ]; then
            LATEST=$(curl -sf https://pypi.org/pypi/g4f/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null) || true
            [ -n "$LATEST" ] && echo "✅ Method B (PyPI API): v$LATEST"
          fi

          # Method C: pip install with invalid version (fallback)
          if [ -z "$LATEST" ]; then
            LATEST=$(pip install "g4f==0.0.0.invalid" 2>&1 | grep -oP 'from versions: .*' | grep -oP '[\d.]+' | tail -1) || true
            [ -n "$LATEST" ] && echo "✅ Method C (pip fallback): v$LATEST"
          fi

          if [ -z "$LATEST" ]; then
            echo "❌ Could not determine latest g4f version from any method"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"

          # ── 3. Compare versions ──
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "✅ Already up to date (v$CURRENT)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "🔄 Update available: v$CURRENT → v$LATEST"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and verify new g4f version
        if: steps.check.outputs.skip != 'true'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          echo "📦 Installing g4f[image]==$LATEST ..."
          pip install "g4f[image]==$LATEST" --quiet 2>&1 || {
            echo "⚠️ g4f[image]==$LATEST failed, trying g4f==$LATEST ..."
            pip install "g4f==$LATEST" --quiet
          }
          python3 -c "import g4f; print(f'✅ g4f v{g4f.__version__} installed and verified')"

      - name: Update requirements.txt
        if: steps.check.outputs.skip != 'true'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          # Use exact match to avoid partial replacements
          sed -i "s/g4f\[image\]>=.*/g4f[image]>=$LATEST/" scripts/requirements.txt
          echo "📝 Updated requirements.txt:"
          grep g4f scripts/requirements.txt

      - name: Update version comment in gemini_image_gen.py
        if: steps.check.outputs.skip != 'true'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          MONTH_YEAR=$(date +'%B %Y')
          # ONLY update the "Tested ..." comment line — nothing else
          sed -i "s/Tested .* (g4f v[0-9.]*)/Tested $MONTH_YEAR (g4f v$LATEST)/" scripts/gemini_image_gen.py || true
          echo "📝 Updated version comment in gemini_image_gen.py"

      - name: Safety check — MODEL_CHAIN must NOT be modified
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "🔒 Verifying MODEL_CHAIN is untouched..."
          # Ensure our models are still exactly as we set them
          grep -q '"flux"' scripts/gemini_image_gen.py || { echo "❌ MODEL_CHAIN corrupted — flux missing!"; exit 1; }
          grep -q '"flux-dev"' scripts/gemini_image_gen.py || { echo "❌ MODEL_CHAIN corrupted — flux-dev missing!"; exit 1; }
          grep -q '"gpt-image"' scripts/gemini_image_gen.py || { echo "❌ MODEL_CHAIN corrupted — gpt-image missing!"; exit 1; }
          # Verify no dead models were re-added
          if grep -q '"dall-e-3"' scripts/gemini_image_gen.py; then echo "❌ Dead model dall-e-3 detected!"; exit 1; fi
          if grep -q '"sdxl"' scripts/gemini_image_gen.py; then echo "❌ Dead model sdxl detected!"; exit 1; fi
          if grep -q '"flux-schnell"' scripts/gemini_image_gen.py; then echo "❌ Dead model flux-schnell detected!"; exit 1; fi
          echo "✅ MODEL_CHAIN verified — all safe"

      - name: Smoke test — verify g4f image imports work
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 -c "
import g4f
from g4f.client import Client
client = Client()
print(f'✅ g4f v{g4f.__version__} — Client created, image generation ready')
          "

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          CURRENT="${{ steps.check.outputs.current }}"
          LATEST="${{ steps.check.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/requirements.txt scripts/gemini_image_gen.py
          git diff --cached --stat
          git commit -m "chore(deps): auto-update g4f v${CURRENT} → v${LATEST}" || {
            echo "⚠️ No changes to commit"
            exit 0
          }
          # Pull with rebase to avoid merge conflicts from parallel pushes
          git pull --rebase origin main || true
          git push
          echo "✅ Pushed g4f update: v${CURRENT} → v${LATEST}"
